name: Embedded runtime verification

on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
      - 'service/**'
      - 'tests/**'
      - 'installer/**'
      - '.github/workflows/embedded-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odoo_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odoo_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ODOO_AI_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/odoo_ai_test
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install service verification dependencies
        run: python -m pip install -e './service[dev]'

      - name: Ruff
        run: python -m ruff check service/src tests installer addons/odoo_ai_assistant

      - name: Service type check
        run: python -m mypy service/src

      - name: Service regression
        run: python -m pytest tests/unit tests/contracts tests/api tests/application tests/adapters tests/security tests/integration -q

      - name: Browser source syntax
        run: |
          node --check addons/odoo_ai_assistant/static/src/services/assistant_stream_client.js
          node --check addons/odoo_ai_assistant/static/src/services/assistant_panel_service.js
          node --check addons/odoo_ai_assistant/static/src/components/assistant_panel/assistant_panel.js
          node --check addons/odoo_ai_assistant/static/tests/assistant_stream_client.test.js
          node --check addons/odoo_ai_assistant/static/tests/assistant_panel_service.test.js
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('addons/odoo_ai_assistant/static/src/components/assistant_panel/assistant_panel.xml')
          print('assistant_panel.xml: ok')
          PY

      - name: Install Odoo 18 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev libffi-dev libssl-dev liblcms2-dev \
            postgresql-client

      - name: Prepare Odoo 18
        run: |
          git clone --depth 1 --branch 18.0 https://github.com/odoo/odoo.git odoo-src
          python -m pip install -r odoo-src/requirements.txt
          dropdb -h 127.0.0.1 -U postgres --if-exists embedded_runtime_test
          createdb -h 127.0.0.1 -U postgres embedded_runtime_test
          cat > /tmp/odoo-embedded-runtime.conf <<EOF
          [options]
          admin_passwd = embedded-runtime-local-only
          db_host = 127.0.0.1
          db_port = 5432
          db_user = postgres
          db_password = postgres
          addons_path = $GITHUB_WORKSPACE/addons,$GITHUB_WORKSPACE/odoo-src/addons
          without_demo = all
          EOF

      - name: Odoo 18 addon install and tests
        run: |
          python odoo-src/odoo-bin \
            -c /tmp/odoo-embedded-runtime.conf \
            -d embedded_runtime_test \
            -i odoo_ai_assistant \
            --test-enable \
            --stop-after-init \
            --test-tags /odoo_ai_assistant

      - name: Odoo 18 addon update
        run: |
          python odoo-src/odoo-bin \
            -c /tmp/odoo-embedded-runtime.conf \
            -d embedded_runtime_test \
            -u odoo_ai_assistant \
            --stop-after-init
