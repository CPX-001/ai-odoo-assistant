[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-ai-host-broker"
version = "0.1.0"
description = "Typed local privilege broker for Odoo AI Assistant"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}

[tool.setuptools]
packages = ["odoo_ai_host_broker"]
